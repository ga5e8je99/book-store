<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Book Store</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Auth CSS -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <!-- Top Header -->
  <header class="auth-header">
    <a href="../index.html" class="logo-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 512 512">
        <path d="M512 150v332H359.43c-41.925 0-63.974 28.428-66.22 30h-74.42c-2.278-1.594-24.012-30-66.22-30H0V120h30v332h122.7c46.882 0 72.978 26.451 79.48 30h47.64c6.499-3.548 32.602-30 79.48-30H482V150z" fill="#AD9066"/>
      </svg>
      <h1 class="logo-text">Book<span>Store</span></h1>
    </a>
    <a href="../index.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
      <i class="fas fa-home me-1"></i> Back to Store
    </a>
  </header>

  <!-- Main Centered Container -->
  <main class="auth-container">
    <div class="auth-card-wrapper">

      <!-- Left Form Column -->
      <div class="auth-form-column">
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your account to continue your reading journey.</p>

        <!-- Feedback Alert Banner -->
        <div id="authAlertBanner" class="auth-alert-banner"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-envelope"></i>
              <input type="email" class="form-control-custom" id="email" placeholder="name@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label class="form-label" for="password">Password</label>
              <a href="#" class="small text-muted" onclick="alert('Password reset link has been dispatched to your email.');">Forgot password?</a>
            </div>
            <div class="input-icon-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" class="form-control-custom" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" class="btn-auth-submit" id="loginSubmitBtn">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>

          <div class="auth-footer-text">
            Don't have an account yet? <a href="signup.html">Create an Account</a>
          </div>
        </form>
      </div>

      <!-- Right Visual Column -->
      <div class="auth-visual-column">
        <img src="../image/undraw_reading_time_re_phf7.svg" alt="Reading Time">
        <p class="auth-visual-quote">"A room without books is like a body without a soul."</p>
        <span class="auth-visual-author">&mdash; Marcus Tullius Cicero</span>
      </div>

    </div>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
