<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout — Book Store</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Payment CSS -->
  <link rel="stylesheet" href="../css/payment.css">
</head>
<body>

  <!-- ================= Header ================= -->
  <header class="site-header">
    <div class="container-fluid">
      <a href="../index.html" class="logo-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 512 512">
          <path d="M512 150v332H359.43c-41.925 0-63.974 28.428-66.22 30h-74.42c-2.278-1.594-24.012-30-66.22-30H0V120h30v332h122.7c46.882 0 72.978 26.451 79.48 30h47.64c6.499-3.548 32.602-30 79.48-30H482V150z" fill="#AD9066"/>
        </svg>
        <h1 class="logo-text">Book<span>Store</span></h1>
      </a>
      <div>
        <a href="shop.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
          <i class="fas fa-arrow-left"></i> Return to Cart
        </a>
      </div>
    </div>
  </header>

  <!-- ================= Main Checkout Container ================= -->
  <main class="checkout-container">
    <div class="row g-4">

      <!-- Left Column: Payment Form -->
      <div class="col-lg-7">
        <div class="payment-card">
          <h2 class="payment-title"><i class="fas fa-lock text-success me-2"></i> Payment Details</h2>

          <form id="paymentForm">
            <!-- Card Number -->
            <div class="mb-3">
              <label class="form-label" for="cardNumber">Card Number</label>
              <div class="card-number-wrapper">
                <input type="text" id="cardNumber" class="form-control-custom" placeholder="4111 2222 3333 4444" maxlength="19" required autocomplete="cc-number">
                <i class="fab fa-cc-visa card-brand-icon" id="cardBrandIcon"></i>
              </div>
              <small id="cardError" class="text-danger" style="display: none;">Invalid card number</small>
            </div>

            <!-- Expiry & CVV Row -->
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label" for="expiryDate">Expiration Date</label>
                <input type="text" id="expiryDate" class="form-control-custom" placeholder="MM/YY" maxlength="5" required autocomplete="cc-exp">
                <small id="expiryError" class="text-danger" style="display: none;">Invalid date (MM/YY)</small>
              </div>
              <div class="col-6">
                <label class="form-label" for="cvv">Security Code (CVV)</label>
                <input type="password" id="cvv" class="form-control-custom" placeholder="123" maxlength="4" required autocomplete="cc-csc">
                <small id="cvvError" class="text-danger" style="display: none;">3 or 4 digits</small>
              </div>
            </div>

            <!-- Cardholder Name -->
            <div class="mb-4">
              <label class="form-label" for="cardName">Cardholder Name</label>
              <input type="text" id="cardName" class="form-control-custom" placeholder="John Doe" required autocomplete="cc-name">
            </div>

            <!-- Payment Button -->
            <button type="submit" class="btn-pay-now" id="submitButton">
              <i class="fas fa-check-circle"></i> Pay Now (<span id="payBtnAmount">$0.00</span>)
            </button>
          </form>
        </div>
      </div>

      <!-- Right Column: Order Summary Preview -->
      <div class="col-lg-5">
        <div class="order-summary-box">
          <h3 class="summary-title" style="font-size: 1.35rem; margin-bottom: 1rem;">Items In Order</h3>
          <div class="order-items-scroll" id="orderItemsList">
            <!-- Rendered by JS -->
          </div>

          <div class="order-summary-total-row">
            <span>Total Payable:</span>
            <span class="total-due-badge" id="orderTotalAmount">$0.00</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ================= Success Confirmation Modal ================= -->
  <div class="payment-success-modal" id="successModal">
    <div class="payment-success-card">
      <div class="success-check-circle">
        <i class="fas fa-check"></i>
      </div>
      <h3>Payment Successful!</h3>
      <p>Thank you for your purchase. A receipt and digital order confirmation has been created for you.</p>
      <a href="../index.html" class="btn-pay-now" style="text-decoration: none;">
        Return to Homepage
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/paymant.js"></script>
</body>
</html>
